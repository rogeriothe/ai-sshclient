# Roda os testes, builda o binário estático e publica o pacote genérico no
# registry do Gitea a cada tag v*.
name: Publicar pacote

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Preparar o Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rodar os testes
        run: cargo test -- --test-threads=1

  build:
    needs: testes
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Preparar o Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Instalar o toolchain musl
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y musl-tools

      # Binário estático: sem dependência de glibc/OpenSSL no destino, roda em
      # qualquer Linux x86_64.
      - name: Buildar o binario
        run: make dist

      - name: Guardar o artefato
        uses: actions/upload-artifact@v4
        with:
          name: ai-sshclient-x86_64-linux
          path: dist/ai-sshclient-x86_64-linux

  publicar:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o artefato
        uses: actions/download-artifact@v4
        with:
          name: ai-sshclient-x86_64-linux
          path: dist

      # Requer os secrets REGISTRY_USERNAME / REGISTRY_TOKEN (token com escopo
      # write:package). Settings > Actions > Secrets.
      #
      # server_url/repository_owner vêm da expressão (resolvida pelo motor de
      # Actions), não das env GITHUB_SERVER_URL/GITHUB_REPOSITORY_OWNER do
      # processo: nesta instância elas apontavam pro endereço interno do
      # runner (http://gitea:3000) e devolviam 404 na API de pacotes.
      - name: Publicar pacote generico
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          SERVER_URL: ${{ github.server_url }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          url="${SERVER_URL}/api/packages/${OWNER}/generic/ai-sshclient/${version}/ai-sshclient-x86_64-linux"
          echo "publicando em ${url}"
          status=$(curl -sS -o /tmp/publish-response.txt -w "%{http_code}" \
            -u "${REGISTRY_USERNAME}:${REGISTRY_TOKEN}" \
            --upload-file dist/ai-sshclient-x86_64-linux \
            "${url}")
          echo "status HTTP: ${status}"
          cat /tmp/publish-response.txt
          echo
          if [ "${status}" -lt 200 ] || [ "${status}" -ge 300 ]; then
            echo "falha ao publicar (status ${status})"
            exit 1
          fi
